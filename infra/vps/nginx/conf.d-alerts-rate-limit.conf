# Rate-limit зона для публичного API на голом IP (1 vCPU VPS).
# Устанавливается в /etc/nginx/conf.d/alerts-rate-limit.conf
# (включается в http-контекст nginx.conf — limit_req_zone нельзя объявлять
# внутри server). Применяется в sites-enabled/alerts-ua.conf.

limit_req_zone $binary_remote_addr zone=alerts_api:10m rate=10r/s;
