server {
    listen 80;
    listen [::]:80;
    server_name 173.242.53.129;

    # gzip включён на уровне http в nginx.conf, но gzip_types по умолчанию
    # сжимает только text/html — добавляем JSON-эндпоинты API.
    # comp_level 1: на 1-vCPU VPS более высокие уровни дороже, чем выгода.
    gzip on;
    gzip_comp_level 1;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json text/plain;

    location /api/ {
        # Публичный API на голом IP: без rate-limit один клиент способен
        # положить 1-vCPU VPS (особенно /map/static-geometry и прочие
        # тяжёлые эндпоинты). burst пропускает всплеск от одного устройства
        # (старт приложения = несколько последовательных запросов).
        limit_req zone=alerts_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
