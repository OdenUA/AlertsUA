<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alerts UA</title>
    <link rel="stylesheet" href="lib/leaflet.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/map-controls.css" />
    <link rel="stylesheet" href="css/markers.css" />
    <link rel="stylesheet" href="css/overlays.css" />
    <link rel="stylesheet" href="css/threat-popups.css" />
    <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
    <div id="map"></div>
    <div id="status"></div>
    <script src="lib/leaflet.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/geometry.js"></script>
    <script src="js/threat-engine.js"></script>
    <script src="js/map-initialization.js"></script>
    <!-- Occupied territories must load before alert-layers (it references loadOccupiedTerritories) -->
    <script src="js/occupied-territories.js"></script>
    <script src="js/alert-layers.js"></script>
    <!-- Static geometry loader — loads GeoJSON from local assets (file://) -->
    <script src="js/static-geometry.js"></script>
    <!-- Status bundle loader — lightweight status updates (~86KB vs 2MB+ full geometry) -->
    <script src="js/status-bundle.js"></script>
    <script src="js/subscription-markers.js"></script>
    <script src="js/user-location.js"></script>
    <script src="js/android-bridge.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
